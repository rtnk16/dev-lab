name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check language pairs and links
        run: python3 scripts/check_docs.py
      - name: Check that changed documents changed in both languages
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_docs.py --base "origin/${{ github.base_ref }}"

  changes:
    runs-on: ubuntu-latest
    outputs:
      blockwave: ${{ steps.filter.outputs.blockwave }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        name: Detect BLOCKWAVE changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            base="$(git merge-base "origin/$BASE_REF" HEAD)"
          elif git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            base="$BEFORE"
          else
            echo "blockwave=true" >> "$GITHUB_OUTPUT"  # no usable base: run everything
            exit 0
          fi
          if git diff --name-only "$base" HEAD | grep -qE '^(projects/blockwave/|\.github/workflows/checks\.yml$)'; then
            echo "blockwave=true" >> "$GITHUB_OUTPUT"
          else
            echo "blockwave=false" >> "$GITHUB_OUTPUT"
          fi

  blockwave:
    needs: changes
    if: needs.changes.outputs.blockwave == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/blockwave
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: projects/blockwave/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
