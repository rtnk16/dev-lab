name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check language pairs and links
        run: python3 scripts/check_docs.py
      - name: Check that changed documents changed in both languages
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_docs.py --base "origin/${{ github.base_ref }}"

  blockwave:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/blockwave
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: projects/blockwave/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
